<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JaxMaze Editor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #fff;
    }
    .description {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .main-area {
      flex: 1;
    }
    .sidebar {
      width: 280px;
      flex-shrink: 0;
    }
    .panel {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    .grid-container {
      display: inline-block;
      background: #0f0f23;
      border-radius: 8px;
      padding: 8px;
      border: 2px solid #333;
    }
    .grid {
      display: grid;
      gap: 1px;
      background: #333;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .cell:hover {
      transform: scale(1.1);
      z-index: 10;
      position: relative;
    }
    .cell img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .tool-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .tool-btn {
      width: 48px;
      height: 48px;
      border: 2px solid #333;
      border-radius: 6px;
      background: #1a1a2e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .tool-btn:hover {
      border-color: #555;
      background: #222;
    }
    .tool-btn.selected {
      border-color: #4a9eff;
      box-shadow: 0 0 10px rgba(74, 158, 255, 0.3);
    }
    .tool-btn img {
      width: 32px;
      height: 32px;
      image-rendering: pixelated;
    }
    .tool-btn .icon {
      font-size: 20px;
    }
    .direction-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      width: fit-content;
    }
    .direction-btns button {
      width: 36px;
      height: 36px;
      border: 2px solid #333;
      border-radius: 4px;
      background: #1a1a2e;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
    }
    .direction-btns button:hover {
      border-color: #555;
    }
    .direction-btns button.selected {
      border-color: #4a9eff;
      background: #2a3f5f;
    }
    .object-palette {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      max-height: 300px;
      overflow-y: auto;
      padding: 4px;
    }
    .object-btn {
      width: 40px;
      height: 40px;
      border: 2px solid #333;
      border-radius: 4px;
      background: #000;
      cursor: pointer;
      padding: 2px;
      transition: all 0.15s;
    }
    .object-btn:hover {
      border-color: #555;
    }
    .object-btn.selected {
      border-color: #4a9eff;
      box-shadow: 0 0 8px rgba(74, 158, 255, 0.4);
    }
    .object-btn img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls label {
      color: #888;
      font-size: 0.85rem;
    }
    .controls input[type="number"] {
      width: 60px;
      padding: 6px 8px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #1a1a2e;
      color: #fff;
      font-size: 0.9rem;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #4a9eff;
      color: #fff;
    }
    .btn-primary:hover {
      background: #3a8eef;
    }
    .btn-secondary {
      background: #333;
      color: #fff;
    }
    .btn-secondary:hover {
      background: #444;
    }
    .export-area {
      margin-top: 16px;
    }
    .export-area textarea {
      width: 100%;
      height: 200px;
      background: #0f0f23;
      border: 1px solid #333;
      border-radius: 6px;
      color: #4ec9b0;
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 0.75rem;
      padding: 12px;
      resize: vertical;
    }
    .copy-status {
      color: #4a9eff;
      font-size: 0.85rem;
      margin-left: 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .copy-status.show {
      opacity: 1;
    }
    .object-label {
      font-size: 0.7rem;
      color: #666;
      text-align: center;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 40px;
    }
    .object-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>JaxMaze Editor</h1>
  <p class="description">Create maze layouts for JaxMaze. Click cells to place walls, objects, or the agent.</p>

  <div class="container">
    <div class="main-area">
      <div class="panel">
        <div class="panel-title">Grid</div>
        <div class="controls" style="margin-bottom: 12px;">
          <label>Rows:</label>
          <input type="number" id="rows" value="13" min="3" max="50">
          <label>Cols:</label>
          <input type="number" id="cols" value="13" min="3" max="50">
          <button class="btn btn-secondary" onclick="resizeGrid()">Resize</button>
          <button class="btn btn-secondary" onclick="clearGrid()">Clear</button>
        </div>
        <div class="grid-container">
          <div class="grid" id="grid"></div>
        </div>
      </div>

      <div class="panel export-area">
        <div class="panel-title">Export</div>
        <div style="margin-bottom: 8px;">
          <button class="btn btn-primary" onclick="exportCode()">Generate Python Code</button>
          <button class="btn btn-secondary" onclick="copyCode()">Copy to Clipboard</button>
          <span class="copy-status" id="copyStatus">Copied!</span>
        </div>
        <textarea id="exportCode" readonly placeholder="Click 'Generate Python Code' to see the output..."></textarea>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <div class="panel-title">Tools</div>
        <div class="tool-group">
          <button class="tool-btn selected" id="tool-wall" onclick="selectTool('wall')" title="Wall">
            <img id="wall-img" alt="Wall">
          </button>
          <button class="tool-btn" id="tool-eraser" onclick="selectTool('eraser')" title="Eraser">
            <span class="icon">&#x2715;</span>
          </button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Agent</div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="tool-btn" id="tool-agent" onclick="selectTool('agent')" title="Agent">
            <img id="agent-preview" alt="Agent">
          </button>
          <div class="direction-btns">
            <div></div>
            <button id="dir-up" onclick="setDirection(3)" title="Up">&#x2191;</button>
            <div></div>
            <button id="dir-left" onclick="setDirection(2)" title="Left">&#x2190;</button>
            <button id="dir-down" class="selected" onclick="setDirection(1)" title="Down">&#x2193;</button>
            <button id="dir-right" onclick="setDirection(0)" title="Right">&#x2192;</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Objects (49)</div>
        <div class="object-palette" id="objectPalette"></div>
      </div>
    </div>
  </div>

ar//3KzJxLC4GbiVpAvZgkwDFY++HlOh1fDLT0aWxrYC3GLE7YtDfqFNEFBo52ocLdKA6mQoUFcyNAg5oUJ/idgOK0LmFurCKgsawKqb0kKqOdmBWxER4J+7r0vcxjQZgGD8xAtwjB6fAAAAABJRU5ErkJggg==", "agent_down": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAAbUlEQVR4nO2VwQ0AIQgEWfrv2SvgBFdDgAfzU4PDRhJFhmrw31qh1ynl5NgWbgSxKN+Lj1VSlCBDgJtb8CCIQp0zMgSeBSFosQCnenRPIG6PzBQ0SCBGp+QQ90iQIYC7DBAkse5/7DZvMAxi8gHGxgM6PvaTsQAAAABJRU5ErkJggg==", "agent_left": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAAdklEQVR4nO2USw7AIAhEwXD/K093TfrRAg5JF7ydkbwRMYo0zf/AdWl1aloAlrtWp84HIFJsdepYACSJFXm/A/bV7wEs78mQYnS2AZJ0LIqm4RG8EmSl3hlotqHYkDUes3XPcEi3nqk6Dkh5KfeGmNIn9L+gaQ6/3Q8wFaRpyAAAAABJRU5ErkJggg==", "agent_up": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAAb0lEQVR4nO3UQQqAMAxE0ZD733kK3YlokmlCs8jDhba034IoMsYD9hWiUkwbBfC6SQ5wvAH8PiYEaD0CcA+SgRN2ANRUIHDICMBaj+4nqA04P0TQgRT6NRH6ZYIIZNE7AcQ3QiiQSP3vYqIXDim1AKdQFBllE2oGAAAAAElFTkSuQmCC"};

    // Object keys in order (matching image_dict order)
    const OBJECT_KEYS = [
      "apple_sliced", "spoon", "onion_sliced_cooked", "onion_cooked", "lettuce_sliced_cooked",
      "bowl", "lettuce_dirty", "orange_dirty", "tomato_dirty", "onion_sliced",
      "knife_dirty", "potato", "pot_dirty", "potato_dirty", "mug_dirty",
      "apple_dirty", "tomato_sliced_cooked", "fork_dirty", "microwave_on", "plates",
      "pan_dirty", "onion", "orange_sliced", "glass_filled", "microwave",
      "tomato", "potato_sliced", "orange", "pot", "apple",
      "onion_dirty", "fridge", "plates_dirty", "tomato_cooked", "stove_on",
      "sink_on", "tomato_sliced", "pan", "stove", "potato_cooked",
      "bowl_dirty", "knife", "lettuce_cooked", "glass", "lettuce",
      "fork", "potato_sliced_cooked", "lettuce_sliced", "sink"
    ];

    const DIRECTION_CHARS = ['>', 'v', '<', '^'];
    const DIRECTION_KEYS = ['right', 'down', 'left', 'up'];

    let gridData = [];
    let rows = 13;
    let cols = 13;
    let currentTool = 'wall';
    let selectedObject = null;
    let agentDirection = 1; // down
    let isMouseDown = false;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Set tool images
      document.getElementById('wall-img').src = TILES.wall;
      updateAgentPreview();

      // Build object palette
      buildObjectPalette();

      // Initialize grid
      initGrid();

      // Mouse tracking for drag painting
      document.addEventListener('mousedown', () => isMouseDown = true);
      document.addEventListener('mouseup', () => isMouseDown = false);
    });

    function buildObjectPalette() {
      const palette = document.getElementById('objectPalette');
      palette.innerHTML = '';
      OBJECT_KEYS.forEach(key => {
        const item = document.createElement('div');
        item.className = 'object-item';
        const btn = document.createElement('button');
        btn.className = 'object-btn';
        btn.id = 'obj-' + key;
        btn.onclick = () => selectObject(key);
        btn.title = key;
        const img = document.createElement('img');
        img.src = TILES[key];
        img.alt = key;
        btn.appendChild(img);
        item.appendChild(btn);
        palette.appendChild(item);
      });
    }

    function initGrid() {
      rows = parseInt(document.getElementById('rows').value);
      cols = parseInt(document.getElementById('cols').value);
      gridData = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          row.push(null); // null = empty
        }
        gridData.push(row);
      }
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
      grid.innerHTML = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.onmousedown = (e) => { e.preventDefault(); handleCellClick(r, c); };
          cell.onmouseenter = (e) => { if (isMouseDown) handleCellClick(r, c); };
          updateCellDisplay(cell, gridData[r][c]);
          grid.appendChild(cell);
        }
      }
    }

    function updateCellDisplay(cell, value) {
      cell.innerHTML = '';
      if (value === null) {
        cell.style.background = '#000';
      } else if (value === 'wall') {
        const img = document.createElement('img');
        img.src = TILES.wall;
        cell.appendChild(img);
        cell.style.background = '';
      } else if (value && value.type === 'agent') {
        const img = document.createElement('img');
        img.src = TILES['agent_' + DIRECTION_KEYS[value.direction]];
        cell.appendChild(img);
        cell.style.background = '';
      } else if (value && value.type === 'object') {
        const img = document.createElement('img');
        img.src = TILES[value.key];
        cell.appendChild(img);
        cell.style.background = '';
      }
    }

    function handleCellClick(r, c) {
      const cell = gridData[r][c];
      if (currentTool === 'wall') {
        // Toggle: if already wall, remove it
        gridData[r][c] = (cell === 'wall') ? null : 'wall';
      } else if (currentTool === 'eraser') {
        gridData[r][c] = null;
      } else if (currentTool === 'agent') {
        // Toggle: if clicking on existing agent, remove it
        if (cell && cell.type === 'agent') {
          gridData[r][c] = null;
        } else {
          // Remove existing agent from elsewhere
          for (let row of gridData) {
            for (let i = 0; i < row.length; i++) {
              if (row[i] && row[i].type === 'agent') {
                row[i] = null;
              }
            }
          }
          gridData[r][c] = { type: 'agent', direction: agentDirection };
        }
      } else if (currentTool === 'object' && selectedObject) {
        // Toggle: if same object already there, remove it
        if (cell && cell.type === 'object' && cell.key === selectedObject) {
          gridData[r][c] = null;
        } else {
          gridData[r][c] = { type: 'object', key: selectedObject };
        }
      }
      renderGrid();
    }

    function selectTool(tool) {
      currentTool = tool;
      selectedObject = null;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('selected'));
      document.querySelectorAll('.object-btn').forEach(btn => btn.classList.remove('selected'));
      const toolBtn = document.getElementById('tool-' + tool);
      if (toolBtn) toolBtn.classList.add('selected');
    }

    function selectObject(key) {
      currentTool = 'object';
      selectedObject = key;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('selected'));
      document.querySelectorAll('.object-btn').forEach(btn => btn.classList.remove('selected'));
      document.getElementById('obj-' + key).classList.add('selected');
    }

    function setDirection(dir) {
      agentDirection = dir;
      document.querySelectorAll('.direction-btns button').forEach(btn => btn.classList.remove('selected'));
      const dirNames = ['dir-right', 'dir-down', 'dir-left', 'dir-up'];
      document.getElementById(dirNames[dir]).classList.add('selected');
      updateAgentPreview();
      // Update existing agent on grid if any
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (gridData[r][c] && gridData[r][c].type === 'agent') {
            gridData[r][c].direction = dir;
          }
        }
      }
      renderGrid();
    }

    function updateAgentPreview() {
      document.getElementById('agent-preview').src = TILES['agent_' + DIRECTION_KEYS[agentDirection]];
    }

    function resizeGrid() {
      initGrid();
    }

    function clearGrid() {
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          gridData[r][c] = null;
        }
      }
      renderGrid();
    }

    function exportCode() {
      // Build maze string and char_to_key mapping
      let usedChars = {};
      let charIndex = 0;
      const availableChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

      let mazeLines = [];
      let hasAgent = false;

      for (let r = 0; r < rows; r++) {
        let line = '';
        for (let c = 0; c < cols; c++) {
          const cell = gridData[r][c];
          if (cell === null) {
            line += '.';
          } else if (cell === 'wall') {
            line += '#';
          } else if (cell.type === 'agent') {
            line += DIRECTION_CHARS[cell.direction];
            hasAgent = true;
          } else if (cell.type === 'object') {
            // Assign a character to this object key
            if (!usedChars[cell.key]) {
              usedChars[cell.key] = availableChars[charIndex++];
            }
            line += usedChars[cell.key];
          }
        }
        mazeLines.push(line);
      }

      // Generate Python code
      let code = `maze = """\n${mazeLines.join('\n')}\n""".strip()\n\n`;

      if (Object.keys(usedChars).length > 0) {
        code += 'char_to_key = dict(\n';
        for (const [key, char] of Object.entries(usedChars)) {
          code += `    ${char}="${key}",\n`;
        }
        code += ')\n\n';
      } else {
        code += 'char_to_key = {}\n\n';
      }

      code += `# Usage:
from jaxmaze import utils
image_dict = utils.load_image_dict()
object_to_index = {key: idx for idx, key in enumerate(image_dict["keys"])}
map_init = utils.from_str(maze, char_to_key=char_to_key, object_to_index=object_to_index)`;

      if (!hasAgent) {
        code = '# WARNING: No agent placed! Add an agent before using this maze.\n\n' + code;
      }

      document.getElementById('exportCode').value = code;
    }

    function copyCode() {
      const textarea = document.getElementById('exportCode');
      textarea.select();
      document.execCommand('copy');
      const status = document.getElementById('copyStatus');
      status.classList.add('show');
      setTimeout(() => status.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
